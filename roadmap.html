<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
  #app{max-width:1400px;margin:0 auto;padding:24px}
  h1{font-size:20px;font-weight:600;color:#0F238C;margin-bottom:16px;letter-spacing:-0.3px}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar button{font-size:12px;padding:5px 11px;border:1px solid #d0d0cc;border-radius:6px;background:#fff;color:#1a1a1a;cursor:pointer;font-family:inherit}
  .toolbar button:hover{background:#f0f0ee;border-color:#aaa}
  .toolbar button.active{background:#0F238C;color:#fff;border-color:#0F238C}
  .toolbar select{font-size:12px;padding:5px 8px;border:1px solid #d0d0cc;border-radius:6px;background:#fff;color:#1a1a1a;cursor:pointer;font-family:inherit}
  .sep{width:1px;height:22px;background:#d0d0cc;margin:0 2px;flex-shrink:0}
  .toolbar-label{font-size:12px;color:#888;white-space:nowrap}
  #chart-wrap{overflow-x:auto;border:1px solid #e0e0dc;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  #chart{position:relative}
  .time-header{display:flex;border-bottom:1px solid #e8e8e4;padding-left:180px;position:sticky;top:0;background:#fff;z-index:5}
  .time-cell{font-size:11px;color:#888;padding:7px 0;text-align:center;border-right:1px solid #f0f0ec;flex-shrink:0;white-space:nowrap;overflow:hidden;user-select:none}
  .lane{display:flex;border-bottom:1px solid #f0f0ec;min-height:46px;position:relative;align-items:stretch}
  .lane:last-of-type{border-bottom:none}
  .lane-label{width:180px;min-width:180px;padding:8px 14px;font-size:13px;font-weight:600;color:#1a1a1a;border-right:1px solid #f0f0ec;display:flex;align-items:flex-start;gap:6px;cursor:pointer;position:relative;z-index:2;background:#fafaf8}
  .lane-label:hover{background:#f5f5f0}
  .lane-label:hover .edit-icon{opacity:1}
  .edit-icon{opacity:0;font-size:13px;color:#aaa;margin-top:1px;flex-shrink:0}
  .bars-area{flex:1;position:relative}
  .bar{position:absolute;height:28px;border-radius:5px;display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .12s,transform .12s}
  .bar:hover{opacity:.82;transform:translateY(-1px)}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:#E6001E;z-index:10;pointer-events:none}
  .today-label{position:absolute;top:4px;font-size:10px;color:#E6001E;white-space:nowrap;transform:translateX(-50%);font-weight:500}
  .col-line{position:absolute;top:0;bottom:0;width:1px;background:#f5f5f0;pointer-events:none}
  .add-project-btn{font-size:12px;padding:5px 10px;border:1px dashed #c0c0bc;border-radius:6px;background:transparent;color:#888;cursor:pointer;margin:8px 12px 10px 180px;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
  .add-project-btn:hover{background:#f5f5f0;color:#333;border-color:#888}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border-radius:12px;padding:22px 24px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.18)}
  .modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:#0F238C}
  .modal label{font-size:12px;color:#666;display:block;margin-bottom:3px;margin-top:12px}
  .modal input,.modal select{width:100%;font-size:13px;padding:7px 9px;border:1px solid #d8d8d4;border-radius:6px;background:#fff;color:#1a1a1a;font-family:inherit}
  .modal input:focus,.modal select:focus{outline:none;border-color:#0F238C}
  .modal-btns{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
  .modal-btns button{font-size:12px;padding:7px 15px;border-radius:6px;cursor:pointer;border:1px solid #d0d0cc;background:#fff;color:#1a1a1a;font-family:inherit}
  .modal-btns button:hover{background:#f5f5f0}
  .modal-btns .primary{background:#0F238C;color:#fff;border-color:#0F238C}
  .modal-btns .primary:hover{background:#0a1a6e}
  .modal-btns .danger{color:#a32d2d;border-color:#e8c0c0}
  .modal-btns .danger:hover{background:#fdf0f0}
  .color-row{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
  .color-swatch{width:24px;height:24px;border-radius:5px;cursor:pointer;border:2.5px solid transparent;transition:transform .1s}
  .color-swatch:hover{transform:scale(1.15)}
  .color-swatch.sel{border-color:#1a1a1a}
  .empty-state{padding:40px 24px;text-align:center;color:#aaa;font-size:13px}
  @media(max-width:600px){
    #app{padding:12px}
    h1{font-size:17px}
    .lane-label{width:120px;min-width:120px;font-size:12px;padding:6px 8px}
    .time-header{padding-left:120px}
    .add-project-btn{margin-left:120px}
  }
</style>
</head>
<body>
<div id="app">
  <h1>Roadmap</h1>
  <div class="toolbar">
    <button onclick="openAddLane()">+ Add theme</button>
    <div class="sep"></div>
    <span class="toolbar-label">Granularity:</span>
    <button class="active" id="g-weeks" onclick="setGranularity('weeks',this)">Weeks</button>
    <button id="g-months" onclick="setGranularity('months',this)">Months</button>
    <button id="g-quarters" onclick="setGranularity('quarters',this)">Quarters</button>
    <div class="sep"></div>
    <span class="toolbar-label">Year:</span>
    <select id="year-sel" onchange="setYear(this.value)"></select>
    <div class="sep"></div>
    <button onclick="exportPNG()">&#8659; Export PNG</button>
  </div>
  <div id="chart-wrap">
    <div id="chart"></div>
  </div>
</div>
<div id="modal-root"></div>

<script>
const COLORS=[
  {hex:'#0F238C',label:'ASML blue'},
  {hex:'#1297E4',label:'light blue'},
  {hex:'#3B6D11',label:'green'},
  {hex:'#BA7517',label:'amber'},
  {hex:'#A32D2D',label:'red'},
  {hex:'#533AB7',label:'purple'},
  {hex:'#0F6E56',label:'teal'},
  {hex:'#993556',label:'pink'},
  {hex:'#5F5E5A',label:'gray'},
];

let state=load();
let granularity='weeks';
let viewYear=new Date().getFullYear();

function load(){
  try{const d=localStorage.getItem('roadmap_v2');if(d)return JSON.parse(d);}catch(e){}
  return{lanes:[
    {id:1,name:'Discovery & Research',color:'#0F238C',items:[
      {id:101,name:'User research',start:'2025-01-06',end:'2025-02-28',color:'#0F238C'},
      {id:102,name:'Market analysis',start:'2025-02-10',end:'2025-04-15',color:'#1297E4'},
    ]},
    {id:2,name:'Product Development',color:'#3B6D11',items:[
      {id:201,name:'MVP build',start:'2025-03-01',end:'2025-07-31',color:'#3B6D11'},
      {id:202,name:'Beta testing',start:'2025-06-01',end:'2025-09-30',color:'#BA7517'},
    ]},
    {id:3,name:'Go-to-Market',color:'#993556',items:[
      {id:301,name:'Campaign prep',start:'2025-08-01',end:'2025-10-31',color:'#993556'},
    ]},
  ]};
}

function save(){localStorage.setItem('roadmap_v2',JSON.stringify(state));}

function getYears(){
  let years=new Set([new Date().getFullYear()]);
  state.lanes.forEach(l=>l.items.forEach(it=>{
    years.add(new Date(it.start).getFullYear());
    years.add(new Date(it.end).getFullYear());
  }));
  return Array.from(years).sort();
}

function setGranularity(g,btn){
  granularity=g;
  document.querySelectorAll('.toolbar button[id^=g-]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setYear(y){viewYear=parseInt(y);render();}

function getColumns(){
  if(granularity==='weeks'){
    const cols=[];
    let d=new Date(viewYear,0,1);
    while(d.getDay()!==1)d.setDate(d.getDate()+1);
    while(d.getFullYear()===viewYear){
      cols.push({label:'W'+getWeekNum(d)+' '+d.toLocaleDateString('en',{month:'short',day:'numeric'}),start:new Date(d),end:new Date(d.getTime()+6*86400000)});
      d.setDate(d.getDate()+7);
    }
    return cols;
  }
  if(granularity==='months'){
    return Array.from({length:12},(_,i)=>({
      label:new Date(viewYear,i,1).toLocaleDateString('en',{month:'short'}),
      start:new Date(viewYear,i,1),end:new Date(viewYear,i+1,0)
    }));
  }
  return[
    {label:'Q1 '+viewYear,start:new Date(viewYear,0,1),end:new Date(viewYear,2,31)},
    {label:'Q2 '+viewYear,start:new Date(viewYear,3,1),end:new Date(viewYear,5,30)},
    {label:'Q3 '+viewYear,start:new Date(viewYear,6,1),end:new Date(viewYear,8,30)},
    {label:'Q4 '+viewYear,start:new Date(viewYear,9,1),end:new Date(viewYear,11,31)},
  ];
}

function getWeekNum(d){
  const s=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);
}

function dateToX(date,cols,totalW){
  const d=typeof date==='string'?new Date(date):date;
  const rangeStart=cols[0].start;
  const rangeEnd=cols[cols.length-1].end;
  const total=rangeEnd-rangeStart;
  const off=Math.max(0,Math.min(d-rangeStart,total));
  return (off/total)*totalW;
}

function render(){
  const yearSel=document.getElementById('year-sel');
  const years=getYears();
  yearSel.innerHTML=years.map(y=>`<option value="${y}"${y===viewYear?' selected':''}>${y}</option>`).join('');

  const cols=getColumns();
  const COL_W=granularity==='weeks'?80:granularity==='months'?90:150;
  const totalW=cols.length*COL_W;
  const LABEL_W=window.innerWidth<=600?120:180;

  const chart=document.getElementById('chart');
  chart.style.width=(LABEL_W+totalW)+'px';

  let html='';
  html+=`<div class="time-header" style="padding-left:${LABEL_W}px">`;
  cols.forEach(c=>{
    html+=`<div class="time-cell" style="width:${COL_W}px;min-width:${COL_W}px">${c.label}</div>`;
  });
  html+=`</div>`;

  if(state.lanes.length===0){
    html+=`<div class="empty-state">No themes yet. Click "+ Add theme" to get started.</div>`;
  }

  const today=new Date();
  const todayX=dateToX(today,cols,totalW);
  const todayInView=today>=cols[0].start&&today<=cols[cols.length-1].end;

  state.lanes.forEach(lane=>{
    const rows=[];
    const sorted=[...lane.items].sort((a,b)=>new Date(a.start)-new Date(b.start));
    sorted.forEach(item=>{
      const s=new Date(item.start),e=new Date(item.end);
      const x=dateToX(s,cols,totalW);
      const x2=dateToX(e,cols,totalW);
      const w=Math.max(x2-x,24);
      let row=0;
      while(rows[row]&&rows[row]>x+4)row++;
      rows[row]=x+w;
      item._row=row;item._x=x;item._w=w;
    });
    const laneH=Math.max(46,(Math.max(0,...lane.items.map(i=>i._row||0))+1)*38+10);

    html+=`<div class="lane" style="min-height:${laneH}px">`;
    html+=`<div class="lane-label" style="min-width:${LABEL_W}px;width:${LABEL_W}px" onclick="openEditLane(${lane.id})" title="Click to edit theme">
      <span style="flex:1;line-height:1.3">${lane.name}</span>
      <span class="edit-icon">&#9998;</span>
    </div>`;
    html+=`<div class="bars-area" style="position:relative;height:${laneH}px">`;

    cols.forEach((_,ci)=>{
      html+=`<div class="col-line" style="left:${ci*COL_W}px"></div>`;
    });

    if(todayInView){
      html+=`<div class="today-line" style="left:${todayX}px"><span class="today-label" style="left:1px">today</span></div>`;
    }

    lane.items.forEach(item=>{
      const top=5+item._row*38;
      const textColor=lightenHex(item.color);
      html+=`<div class="bar" style="left:${item._x}px;width:${item._w}px;top:${top}px;background:${item.color};color:${textColor}"
        onclick="openEditItem(${lane.id},${item.id})" title="${item.name}: ${item.start} to ${item.end}">
        ${item.name}
      </div>`;
    });

    html+=`</div></div>`;
  });

  html+=`<button class="add-project-btn" style="margin-left:${LABEL_W}px" onclick="openAddItem()">+ Add project</button>`;
  chart.innerHTML=html;
}

function lightenHex(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)<140?'#fff':'#1a1a1a';
}

function showModal(html){
  document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

function colorSwatches(sel){
  return COLORS.map(c=>`<div class="color-swatch${c.hex===sel?' sel':''}" style="background:${c.hex}" title="${c.label}" onclick="selectColor('${c.hex}',this)"></div>`).join('');
}

let _selectedColor='#0F238C';
function selectColor(hex,el){
  _selectedColor=hex;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}

function openAddLane(){
  _selectedColor='#0F238C';
  showModal(`<div class="modal">
    <h3>Add theme</h3>
    <label>Theme name</label>
    <input id="m-name" placeholder="e.g. Platform Stability" autofocus />
    <label>Color</label>
    <div class="color-row">${colorSwatches('#0F238C')}</div>
    <div class="modal-btns">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="addLane()">Add theme</button>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('m-name')&&document.getElementById('m-name').focus(),50);
}

function addLane(){
  const name=document.getElementById('m-name').value.trim();
  if(!name)return alert('Please enter a theme name.');
  state.lanes.push({id:Date.now(),name,color:_selectedColor,items:[]});
  save();closeModal();render();
}

function openEditLane(id){
  const lane=state.lanes.find(l=>l.id===id);
  _selectedColor=lane.color;
  showModal(`<div class="modal">
    <h3>Edit theme</h3>
    <label>Theme name</label>
    <input id="m-name" value="${lane.name}" />
    <label>Color</label>
    <div class="color-row">${colorSwatches(lane.color)}</div>
    <div class="modal-btns">
      <button class="danger" onclick="deleteLane(${id})">Delete</button>
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveLane(${id})">Save</button>
    </div>
  </div>`);
}

function saveLane(id){
  const lane=state.lanes.find(l=>l.id===id);
  const name=document.getElementById('m-name').value.trim();
  if(!name)return alert('Please enter a theme name.');
  lane.name=name;lane.color=_selectedColor;
  save();closeModal();render();
}

function deleteLane(id){
  if(!confirm('Delete this theme and all its projects?'))return;
  state.lanes=state.lanes.filter(l=>l.id!==id);
  save();closeModal();render();
}

function openAddItem(){
  _selectedColor='#0F238C';
  const laneOpts=state.lanes.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');
  if(!laneOpts)return alert('Add a theme first.');
  const today=new Date().toISOString().slice(0,10);
  showModal(`<div class="modal">
    <h3>Add project</h3>
    <label>Theme</label>
    <select id="m-lane">${laneOpts}</select>
    <label>Project name</label>
    <input id="m-name" placeholder="e.g. API redesign" />
    <label>Start date</label>
    <input id="m-start" type="date" value="${today}" />
    <label>End date</label>
    <input id="m-end" type="date" value="${today}" />
    <label>Bar color</label>
    <div class="color-row">${colorSwatches('#0F238C')}</div>
    <div class="modal-btns">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="addItem()">Add project</button>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('m-name')&&document.getElementById('m-name').focus(),50);
}

function addItem(){
  const laneId=parseInt(document.getElementById('m-lane').value);
  const name=document.getElementById('m-name').value.trim();
  const start=document.getElementById('m-start').value;
  const end=document.getElementById('m-end').value;
  if(!name)return alert('Please enter a project name.');
  if(!start||!end)return alert('Please set start and end dates.');
  if(end<start)return alert('End date must be after start date.');
  state.lanes.find(l=>l.id===laneId).items.push({id:Date.now(),name,start,end,color:_selectedColor});
  save();closeModal();render();
}

function openEditItem(laneId,itemId){
  const lane=state.lanes.find(l=>l.id===laneId);
  const item=lane.items.find(i=>i.id===itemId);
  _selectedColor=item.color;
  const laneOpts=state.lanes.map(l=>`<option value="${l.id}"${l.id===laneId?' selected':''}>${l.name}</option>`).join('');
  showModal(`<div class="modal">
    <h3>Edit project</h3>
    <label>Theme</label>
    <select id="m-lane">${laneOpts}</select>
    <label>Project name</label>
    <input id="m-name" value="${item.name}" />
    <label>Start date</label>
    <input id="m-start" type="date" value="${item.start}" />
    <label>End date</label>
    <input id="m-end" type="date" value="${item.end}" />
    <label>Bar color</label>
    <div class="color-row">${colorSwatches(item.color)}</div>
    <div class="modal-btns">
      <button class="danger" onclick="deleteItem(${laneId},${itemId})">Delete</button>
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveItem(${laneId},${itemId})">Save</button>
    </div>
  </div>`);
}

function saveItem(laneId,itemId){
  const newLaneId=parseInt(document.getElementById('m-lane').value);
  const name=document.getElementById('m-name').value.trim();
  const start=document.getElementById('m-start').value;
  const end=document.getElementById('m-end').value;
  if(!name)return alert('Please enter a project name.');
  if(!start||!end)return alert('Please set start and end dates.');
  if(end<start)return alert('End date must be after start date.');
  const oldLane=state.lanes.find(l=>l.id===laneId);
  const item=oldLane.items.find(i=>i.id===itemId);
  item.name=name;item.start=start;item.end=end;item.color=_selectedColor;
  if(newLaneId!==laneId){
    oldLane.items=oldLane.items.filter(i=>i.id!==itemId);
    state.lanes.find(l=>l.id===newLaneId).items.push(item);
  }
  save();closeModal();render();
}

function deleteItem(laneId,itemId){
  if(!confirm('Delete this project?'))return;
  state.lanes.find(l=>l.id===laneId).items=state.lanes.find(l=>l.id===laneId).items.filter(i=>i.id!==itemId);
  save();closeModal();render();
}

function exportPNG(){
  const el=document.getElementById('chart-wrap');
  html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='roadmap.png';
    a.click();
  });
}

render();
window.addEventListener('resize',()=>render());
</script>
</body>
</html>
